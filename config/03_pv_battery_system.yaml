# Solver options
solver:
  name: "cbc" # solver name, e.g. cbc, glpk, gurobi
  tee: false   # prints solver output to console if true

buses:
  # Electricity bus
  electricity_bus:
    label: "electricity"

technologies:
  # Electricity demand
  electricity_demand:
    profile: "energy_data.csv"
    column: "electricity demand (kW)"
    scaling_factor: 1
    bus: "electricity"
    label: "electricity_demand"

  # Grid
  electricity_grid:
    bus: "electricity"
    variable_costs: 0.3  # €/kWh
    label: "electricity_grid"

  # Grid Feed-in
  grid_feedin:
    bus: "electricity"
    feedin_tariff: 0.08  # €/kwh
    label: "grid_feedin"

  # PV
  pv:
    profile: "energy_data.csv"
    pv_column: "pv yield (kW/kW)"
    capacity: 5 # kW
    lifetime: 25 # years
    capex: 1000 # €/kw
    opex: 2 # %
    label: "pv"
    mode: "invest" # "fixed" or "invest"
    interest_rate: 0.05

  # Battery
  battery:
    capacity: 1  #kWh
    lifetime: 10  #years
    capex: 250  #€/kWh
    opex: 2  # % of capex
    inflow_conversion_factor: 0.9
    loss_rate: 0.01
    mode: "invest"
    interest_rate: 0.05




